services:
  howard.news:
    class: Drupal\howard_paragraphs\Services\HowardNewsService
    arguments: ['@http_client', '@cache.default', '@logger.factory']
  howard.profiles:
    class: Drupal\howard_paragraphs\Services\HowardProfilesService
    arguments: ['@http_client', '@cache.default', '@logger.factory']
  howard.giving:
    class: Drupal\howard_paragraphs\Services\HowardGivingService
    arguments: ['@http_client', '@cache.default', '@logger.factory']
  howard_paragraphs.external_content_cache_clear:
    class: Drupal\howard_paragraphs\Controller\HowardExternalContentCacheClear
    arguments: ['@entity_type.manager', '@cache_tags.invalidator', '@logger.factory', '@messenger']